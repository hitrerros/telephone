databaseChangeLog:
  - changeSet:
      id: 001-create-clients-table
      author: hitrerros
      changes:
        - createTable:
            tableName: clients
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: phone_number
                  type: CHARACTER (5)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

        - createIndex:
            tableName: clients
            indexName: idx_clients_phone_number
            columns:
              - column:
                  name: phone_number

  - changeSet:
      id: 002-create-billing-table
      author: hitrerros
      changes:
        - createTable:
            tableName: billing
            columns:
              - column:
                  name: session_id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: from
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: to
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: start_time
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: end_time
                  type: TIMESTAMP

        - createTable:
            tableName: active_calls
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: from
                  type: UUID
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: start_time
                  type: TIMESTAMP
                  constraints:
                    nullable: false
                    
              - column:
                  name: session_id
                  type: UUID
                  constraints:
                    nullable: false

        - createIndex:
            tableName: active_calls
            indexName: idx_session_id
            columns:
              - column:
                  name: session_id

  - changeSet:
      id: 003-add-default-uuid-to-billing
      author: hitrerros
      changes:
        - addDefaultValue:
            tableName: billing
            columnName: session_id
            defaultValueComputed: gen_random_uuid()

  - changeSet:
      id: 004-create-event-store
      author: hitrerros
      changes:
        - createTable:
            tableName: events
            columns:
              - column:
                  name: event_id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: aggregate_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: aggregate_type
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: sequence
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: event_type
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: payload
                  type: JSONB
                  constraints:
                    nullable: false

              - column:
                  name: occurred_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: events
            columnNames: aggregate_id, sequence
            constraintName: uq_events_aggregate_sequence

        - createIndex:
            tableName: events
            indexName: idx_events_aggregate_id
            columns:
              - column:
                  name: aggregate_id

        - createIndex:
            tableName: events
            indexName: idx_events_type
            columns:
              - column:
                  name: event_type
                  
  - changeSet:
      id: 005-rename-event-sequence-to-version
      author: hitrerros
      changes:
        - dropUniqueConstraint:
            tableName: events
            constraintName: uq_events_aggregate_sequence

        - renameColumn:
            tableName: events
            oldColumnName: sequence
            newColumnName: version
            columnDataType: BIGINT

        - addUniqueConstraint:
            tableName: events
            columnNames: aggregate_id, version
            constraintName: uq_events_aggregate_version                  