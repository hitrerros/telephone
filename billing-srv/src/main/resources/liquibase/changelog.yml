databaseChangeLog:
  - changeSet:
      id: 001-create-clients-table
      author: hitrerros
      changes:
        - createTable:
            tableName: clients
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: phone_number
                  type: CHARACTER (5)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

        - createIndex:
            tableName: clients
            indexName: idx_clients_phone_number
            columns:
              - column:
                  name: phone_number
