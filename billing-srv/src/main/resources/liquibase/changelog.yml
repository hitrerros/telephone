databaseChangeLog:
  - changeSet:
      id: 001-create-clients-table
      author: hitrerros
      changes:
        - createTable:
            tableName: clients
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: phone_number
                  type: CHARACTER (5)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

        - createIndex:
            tableName: clients
            indexName: idx_clients_phone_number
            columns:
              - column:
                  name: phone_number

  - changeSet:
      id: 002-create-billing-table
      author: hitrerros
      changes:
        - createTable:
            tableName: billing
            columns:
              - column:
                  name: session_id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: from
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: to
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: start_time
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: end_time
                  type: TIMESTAMP

        - createTable:
            tableName: active_calls
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: from
                  type: UUID
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: start_time
                  type: TIMESTAMP
                  constraints:
                    nullable: false
                    
              - column:
                  name: session_id
                  type: UUID
                  constraints:
                    nullable: false

        - createIndex:
            tableName: active_calls
            indexName: idx_session_id
            columns:
              - column:
                  name: session_id

